<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CoffeeHouse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="modal-login" class="modal">
  <div class="modal-content">

    <!-- BOTÃO X -->
    <span class="fechar" onclick="fecharModal()">✖</span>

    <h2>Login</h2>

    <input id="loginNome" type="text" placeholder="Digite seu nome" required>
    <input id="loginSenha" type="password" placeholder="Digite sua senha" required>

    <button onclick="fazerLogin()">Entrar</button>

    <p id="erroLogin"></p>
  </div>
</div>
  <!-- SIDEBAR -->
 
  <aside class="sidebar">
     <h2 id="usuario-logado">Visitante</h2>
<button onclick="logout()" class="btn-sair">Sair</button>
    <h1>CoffeeHouse</h1>
    <img class="logocafe" src="fc876b62777505.5a9b740221756.png" alt="imagem de caféteria">

    <h2>Pedidos:</h2>
    <span id="totalPedidos">0</span>

    <h2>Total:</h2>
    <span>R$ <span id="totalValor">0.00</span></span>
     <h2>Meus Pedidos</h2>
<div id="lista-pedidos"></div>
<footer class="footer">
  <div class="footer-content">
    <span class="logo">CoffeeHouse</span>
    

    <div class="redes">
      <img src="application_15072085.png" alt="Instagram">
      <img src="twitter_1384017.png" alt="Twitter">
      <img src="tik-tok_3670299.png" alt="TikTok">
    </div>

    <span class="copy">Copyright-2024</span>
  </div>
</footer>
  </aside>

  <!-- CONTEÚDO -->
  <main class="content">

    <!-- MENU -->
    <nav class="menu">
      <button onclick="trocarCategoria('cafe')">☕ Café</button>
      <button onclick="trocarCategoria('lanches')">🥐 Lanches</button>
      <button onclick="trocarCategoria('sobremesas')">🍰 Sobremesas</button>
    </nav>

    <!-- PRODUTOS -->
    <section id="produtos"></section>

    <!-- PAGINAÇÃO -->
    <div class="paginacao">
      <button onclick="paginaAnterior()">⬅ Anterior</button>
      <button onclick="irParaPagina(1)"class="ativo">1</button>
      <button onclick="irParaPagina(2)">2</button>
      <button onclick="irParaPagina(3)">3</button>
      <button onclick="proximaPagina()">Próximo ➡</button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
